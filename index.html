<body>
  <header>
    <h1>Screen Caffeine</h1>

    <p class="description">
      Keep this page visible to prevent your screen from automatically
      turning off or going to sleep. Use permanent mode, or set a duration
      after which the wake lock will be released automatically.
    </p>

    <div class="status-row">
      <span class="status-label">Current status:</span>
      <span id="status" data-state="waiting">Waiting</span>
    </div>

    <section class="controls" aria-label="Wake lock settings">
      <div class="mode-options">
        <label class="mode-option">
          <input
            id="permanent-mode"
            type="radio"
            name="lock-mode"
            value="permanent"
            checked
          >
          Permanent
        </label>

        <label class="mode-option">
          <input
            id="scheduled-mode"
            type="radio"
            name="lock-mode"
            value="scheduled"
          >
          Scheduled
        </label>
      </div>

      <form id="schedule-form">
        <div class="number-field">
          <label for="duration-hours">Hours</label>
          <input
            id="duration-hours"
            type="number"
            min="0"
            max="168"
            step="1"
            value="1"
            disabled
          >
        </div>

        <div class="number-field">
          <label for="duration-minutes">Minutes</label>
          <input
            id="duration-minutes"
            type="number"
            min="0"
            max="59"
            step="1"
            value="0"
            disabled
          >
        </div>

        <button
          id="apply-schedule"
          type="submit"
          disabled
        >
          Apply schedule
        </button>
      </form>

      <p id="schedule-info" class="schedule-info">
        Current mode: <strong>Permanent</strong>
      </p>

      <p
        id="schedule-error"
        class="schedule-error"
        role="alert"
        aria-live="polite"
      ></p>
    </section>
  </header>

  <main id="log-container">
    <pre id="log"></pre>
  </main>

  <script src="./script.js"></script>
</body>
</html>
