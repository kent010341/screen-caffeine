<body>
    <main class="app">
        <header class="app-header">
            <h1>Screen Caffeine</h1>
            <span class="tool mini-control">
                <button
                    id="open-mini"
                    class="icon-button"
                    type="button"
                    aria-label="Open mini window"
                    aria-describedby="mini-tooltip"
                >
                    <svg
                        class="window-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                        ></rect>
                        <rect
                            x="11"
                            y="11"
                            width="10"
                            height="10"
                            rx="2"
                            fill="currentColor"
                        ></rect>
                    </svg>
                </button>
                <span
                    id="mini-tooltip"
                    class="tooltip"
                    role="tooltip"
                >Open mini window</span>
            </span>
        </header>
        <p
            id="popup-notice"
            class="notice error"
            role="status"
            hidden
        >
            Unable to open mini window. Allow popups for this site and try again.
        </p>

        <section
            id="wake-status"
            class="wake-status"
            data-state="requesting"
            aria-label="Screen status"
        >
            <div
                class="status-orb"
                aria-hidden="true"
            >
                <span
                    id="status-icon"
                    class="icon icon-clock"
                ></span>
            </div>
            <p
                id="status"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            >Starting…</p>
            <p class="primary-instruction">
                <span
                    class="icon icon-eye"
                    aria-hidden="true"
                ></span>
                Keep this page visible.
            </p>
        </section>

        <section
            class="timer"
            aria-label="Optional timer"
        >
            <div class="timer-summary">
                <p
                    class="summary-text"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                >
                    <span
                        class="icon icon-clock"
                        aria-hidden="true"
                    ></span>
                    <span id="schedule-info">No time limit</span>
                </p>
                <span
                    class="tool"
                    id="cancel-control"
                    hidden
                >
                    <button
                        id="cancel-schedule"
                        class="icon-button"
                        type="button"
                        aria-label="Cancel timer"
                        aria-describedby="cancel-tooltip"
                    >
                        <span
                            class="icon icon-x"
                            aria-hidden="true"
                        ></span>
                    </button>
                    <span
                        id="cancel-tooltip"
                        class="tooltip"
                        role="tooltip"
                    >Cancel timer</span>
                </span>
            </div>

            <details id="timer-settings">
                <summary
                    aria-label="Set timer"
                    aria-describedby="timer-tooltip"
                >
                    <span
                        class="icon icon-clock"
                        aria-hidden="true"
                    ></span>
                    <span
                        id="timer-tooltip"
                        class="tooltip"
                        role="tooltip"
                    >Set timer</span>
                </summary>
                <form
                    id="schedule-form"
                    novalidate
                >
                    <div class="number-field">
                        <label for="duration-hours">Hours</label>
                        <input
                            id="duration-hours"
                            type="number"
                            min="0"
                            max="168"
                            step="1"
                            value="1"
                            required
                            aria-describedby="schedule-error"
                        >
                    </div>
                    <div class="number-field">
                        <label for="duration-minutes">Minutes</label>
                        <input
                            id="duration-minutes"
                            type="number"
                            min="0"
                            max="59"
                            step="1"
                            value="0"
                            required
                            aria-describedby="schedule-error"
                        >
                    </div>
                    <span class="tool apply-control">
                        <button
                            id="apply-schedule"
                            class="icon-button"
                            type="submit"
                            aria-label="Apply timer"
                            aria-describedby="apply-tooltip schedule-pending"
                        >
                            <span
                                class="icon icon-check"
                                aria-hidden="true"
                            ></span>
                        </button>
                        <span
                            id="apply-tooltip"
                            class="tooltip"
                            role="tooltip"
                        >Apply timer</span>
                    </span>
                </form>
            </details>

            <p
                id="schedule-pending"
                class="notice pending"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                hidden
            >
                <span
                    class="icon icon-triangle-alert"
                    aria-hidden="true"
                ></span>
                <span id="pending-text"></span>
            </p>
            <p
                id="schedule-error"
                class="notice error"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                hidden
            >
                <span
                    class="icon icon-triangle-alert"
                    aria-hidden="true"
                ></span>
                <span id="error-text"></span>
            </p>
        </section>
    </main>
    <script type="importmap">
        { "imports": { "@screen-caffeine/": "./lib/" } }
    </script>
    <script
        type="module"
        src="./script.js"
    ></script>
</body>
